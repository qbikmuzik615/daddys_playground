services:
  # QuizTastic Opposites - Educational Quiz Game
  - type: web
    name: quiztastic-opposites
    runtime: static
    buildCommand: cd apps/quiztastic-opposites && npm install && npm run build
    staticPublishPath: ./apps/quiztastic-opposites/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
